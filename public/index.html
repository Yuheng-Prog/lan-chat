<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 局域网手机上打开时，按设备宽度渲染 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>局域网聊天室</title>
  <!-- 内联 SVG favicon，避免浏览器额外请求 /favicon.ico 报 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6df6'/%3E%3Cpath d='M24 30h52v30H50l-16 14v-14H24z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ 登录 / 注册 ============ -->
  <section id="authView" class="auth-view">
    <div class="auth-card">
      <h1>局域网聊天室</h1>
      <p class="sub">账号、密码、消息全部保存在本机 SQLite</p>

      <div class="tabs">
        <button class="tab active" data-mode="login" type="button">登录</button>
        <button class="tab" data-mode="register" type="button">注册</button>
      </div>

      <form id="authForm" autocomplete="off">
        <label class="field">
          <span>账号</span>
          <input id="username" type="text" placeholder="2-20 位，中英文/数字/下划线" maxlength="20" required />
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" type="password" placeholder="至少 6 位" maxlength="64" required />
        </label>
        <button id="authSubmit" class="primary" type="submit">登录</button>
        <p id="authMsg" class="form-msg"></p>
      </form>
    </div>
  </section>

  <!-- ============ 聊天主界面 ============ -->
  <section id="chatView" class="chat-view hidden">
    <!-- 左侧：所有账号 -->
    <aside class="sidebar">
      <header class="sidebar-head">
        <div class="me">
          <span id="meName" class="me-name"></span>
          <span class="me-tip">在线</span>
        </div>
        <button id="logoutBtn" class="ghost" type="button">退出</button>
      </header>
      <p class="list-title">全部账号 <span id="userCount">0</span></p>
      <ul id="userList" class="user-list"></ul>
    </aside>

    <!-- 右侧：聊天区 -->
    <main class="main">
      <header class="chat-head">
        <span id="chatTitle">请选择左侧账号开始聊天</span>
        <span id="chatSub" class="chat-sub"></span>
      </header>

      <div id="messageList" class="message-list">
        <div class="empty" id="emptyTip">还没有选择聊天对象</div>
      </div>

      <form id="sendForm" class="send-form">
        <input id="messageInput" type="text" placeholder="输入消息，按回车发送" maxlength="2000" autocomplete="off" disabled />
        <button id="sendBtn" class="primary" type="submit" disabled>发送</button>
      </form>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
